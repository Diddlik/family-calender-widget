name: Google Play closed testing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Play accepts one edit per app at a time; queue uploads instead of running them in parallel.
concurrency:
  group: play-internal
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SECRETS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Skip notice
        if: env.HAS_PLAY_SECRETS != 'true'
        run: echo "::notice::Play secrets are not configured; skipping signed build and upload. See docs/RELEASE.md."

      - name: Restore upload key
        if: env.HAS_PLAY_SECRETS == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        if: env.HAS_PLAY_SECRETS == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      - name: Keep bundle as artifact
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to closed testing (Alpha)
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.diddlik.calendarwidget
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: alpha
          # Play only accepts draft releases until the app has passed its first review; then set the variable to "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
